<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化學合成拓撲圖 Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">🧪 合成拓撲引擎</div>
        <p class="sidebar-hint">點擊選單項目，直接加入畫布。</p>

        <div class="menu-scroll-area">
            <div class="accordion-section">
                <div class="accordion-header active" onclick="toggleAccordion('acc-organic', this)">
                    <span>📂 有機合成</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="accordion-content" id="acc-organic" style="display: flex;">
                    <div class="item-btn" onclick="createNode('Acetic Acid', '乙酸', 'reactant')"><span>乙酸</span><span>+</span></div>
                    <div class="item-btn" onclick="createNode('Ethanol', '乙醇', 'reactant')"><span>乙醇</span><span>+</span></div>
                    <div class="item-btn" onclick="createNode('Methylamine', '甲胺', 'reactant')"><span>甲胺</span><span>+</span></div>
                </div>
            </div>

            <div class="accordion-section">
                <div class="accordion-header" onclick="toggleAccordion('acc-inorganic', this)">
                    <span>🪨 無機反應 & 金屬</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="accordion-content" id="acc-inorganic" style="display: none;">
                    <div class="item-btn" onclick="createNode('Na', '鈉', 'reactant')"><span>鈉 (Na)</span><span>+</span></div>
                    <div class="item-btn" onclick="createNode('H2O', '水', 'reactant')"><span>水 (H2O)</span><span>+</span></div>
                    <div class="item-btn" onclick="createNode('Fe', '鐵棒', 'reactant')"><span>鐵棒 (Fe)</span><span>+</span></div>
                    <div class="item-btn" onclick="createNode('CuSO4', '硫酸銅', 'reactant')"><span>硫酸銅</span><span>+</span></div>
                    <div class="item-btn" onclick="createNode('NaHCO3', '小蘇打', 'reactant')"><span>小蘇打</span><span>+</span></div>
                    <div class="item-btn" onclick="createNode('HCl', '鹽酸', 'reactant')"><span>鹽酸 (HCl)</span><span>+</span></div>
                    <div class="item-btn" onclick="createNode('NaOH', '氫氧化鈉', 'reactant')"><span>氫氧化鈉</span><span>+</span></div>
                    <div class="item-btn" onclick="createNode('CaCO3', '碳酸鈣', 'reactant')"><span>碳酸鈣</span><span>+</span></div>
                </div>
            </div>

            
        </div>
        <div class="instruction-box">
                <b>操作指南：</b><br>
                • 單擊節點：準備反應 (綠框)<br>
                • 空白處拖曳：多選節點 (藍框)<br>
                • 鍵盤 Delete：刪除所選節點<br>
                • 節點右鍵：開啟刪除選單
        </div>
        <button class="btn-clear" onclick="clearBoard()">🗑️ 清空工作區</button>
    </aside>

    <main class="main-content" id="board">
        <svg id="connection-layer"></svg>
        <div id="selection-box"></div>
        
        <div id="context-menu">
            <div class="context-menu-item" id="btn-delete-node">🗑️ 刪除此節點</div>
        </div>

        <div class="status-bar" id="status-bar">
            <span>💡 提示：從左側點擊物質加入，單擊第一個節點，再點擊第二個進行反應。</span>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
